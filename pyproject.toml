[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "reconpipe"
version = "0.1.0"
description = "Composable recon pipeline for web/external assessments"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "dnspython>=2.4",
    "httpx>=0.25",
    "tldextract>=5.0",
    "tenacity>=8.2",
    "maxminddb>=2.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
]

[project.scripts]
rp = "reconpipe.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["reconpipe*"]
