# reconpipe-quiet preset — passive sources + light DNS only
# Compatible with BBOT 2.8.4
# Equivalent to: bbot -t <target> -f subdomain-enum -rf passive -om subdomains
description: "Passive sources only, suitable for early-engagement recon"

flags:
  - subdomain-enum

require_flags:
  - passive

output_modules:
  - subdomains
  - json
